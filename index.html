<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rover Web-BLE Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #121212; color: #e0e0e0; margin: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #1e1e1e; border-radius: 8px; padding: 20px; width: 100%; max-width: 450px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 20px; border: 1px solid #333; }
        h2 { margin-top: 0; color: #00adb5; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .btn { background: #00adb5; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background: #007a80; }
        .btn-disconnect { background: #ff2e63; margin-top: 10px; }
        .btn-disconnect:hover { background: #c71543; }
        .metric { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #2d2d2d; font-size: 18px; }
        .metric span:first-child { color: #aaaaaa; }
        .metric span:last-child { font-family: monospace; font-weight: bold; color: #00adb5; }
        .input-group { display: flex; margin-top: 15px; gap: 10px; }
        input[type="text"] { flex-grow: 1; padding: 10px; background: #2d2d2d; border: 1px solid #444; color: white; border-radius: 4px; font-size: 16px; }
        #status { text-align: center; color: #ff2e63; font-weight: bold; margin-bottom: 15px; }
        .connected { color: #00ff66 !important; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Connection</h2>
        <div id="status">Disconnected</div>
        <button id="connectBtn" class="btn" onclick="connectBLE()">Connect Rover</button>
        <button id="disconnectBtn" class="btn btn-disconnect" onclick="disconnectBLE()" style="display:none;">Disconnect</button>
    </div>

    <div class="card">
        <h2>Telemetry</h2>
        <div class="metric"><span>Encoder Count:</span><span id="encVal">0</span></div>
        <div class="metric"><span>Bus Voltage:</span><span id="voltVal">0.00 V</span></div>
        <div class="metric"><span>Current Draw:</span><span id="currVal">0 mA</span></div>
    </div>

    <div class="card">
        <h2>Command Console</h2>
        <div class="input-group">
            <input type="text" id="cmdInput" placeholder="Type data string here..." value="FORWARD">
            <button class="btn" style="width: auto;" onclick="sendCommand()">Send</button>
        </div>
    </div>

    <script>
        // Use your exact Rover UUID structures
        const ROVER_SVC_UUID = "00001111-2222-3333-4444-555555555555";
        const TELEM_CHR_UUID = "00003333-2222-3333-4444-555555555555";
        const CMD_CHR_UUID   = "00002222-2222-3333-4444-555555555555";

        let bleDevice = null;
        let cmdCharacteristic = null;

        async function connectBLE() {
            try {
                document.getElementById('status').innerText = "Searching...";
                
                // Request phone/PC browser to pop open the native BLE selector window
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [ROVER_SVC_UUID] }]
                });

                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(ROVER_SVC_UUID);

                // Setup Inbound Command Path
                cmdCharacteristic = await service.getCharacteristic(CMD_CHR_UUID);

                // Setup Outbound Telemetry Path
                const telemCharacteristic = await service.getCharacteristic(TELEM_CHR_UUID);
                await telemCharacteristic.startNotifications();
                telemCharacteristic.addEventListener('characteristicvaluechanged', handleTelemetry);

                // Update UI state
                document.getElementById('status').innerText = "CONNECTED";
                document.getElementById('status').className = "connected";
                document.getElementById('connectBtn').style.display = "none";
                document.getElementById('disconnectBtn').style.display = "block";
                
                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

            } catch (error) {
                console.log(error);
                document.getElementById('status').innerText = "Disconnected";
                document.getElementById('status').className = "";
            }
        }

        function handleTelemetry(event) {
            const view = event.target.value;
            
            // Safety Check: Verify our 8-byte frame size match
            if (view.byteLength < 8) return;

            // Verify header sync byte matches (0xFF)
            if (view.getUint8(0) !== 0xFF) return;

            // Extract values using signed 16-bit big-endian reads
            const encoderCount = view.getInt16(1, false); // Bytes 1-2
            const voltageMv   = view.getInt16(3, false); // Bytes 3-4
            const currentMa   = view.getInt16(5, false); // Bytes 5-6

            // Update user dashboard elements
            document.getElementById('encVal').innerText = encoderCount;
            document.getElementById('voltVal').innerText = (voltageMv / 1000).toFixed(2) + " V";
            document.getElementById('currVal').innerText = currentMa + " mA";
        }

        async function sendCommand() {
            if (!cmdCharacteristic) {
                alert("Please connect your Rover first.");
                return;
            }
            
            const textStr = document.getElementById('cmdInput').value;
            if (!textStr) return;

            // Encode the plain string into a byte array
            const encoder = new TextEncoder();
            const byteBuffer = encoder.encode(textStr);

            try {
                // Send down to your ESP32's MyCharacteristicCallbacks routine
                await cmdCharacteristic.writeValueWithoutResponse(byteBuffer);
                console.log("Sent: " + textStr);
            } catch (error) {
                alert("Transmission failed: " + error);
            }
        }

        function disconnectBLE() {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
            }
        }

        function onDisconnected() {
            document.getElementById('status').innerText = "Disconnected";
            document.getElementById('status').className = "";
            document.getElementById('connectBtn').style.display = "block";
            document.getElementById('disconnectBtn').style.display = "none";
            cmdCharacteristic = null;
        }
    </script>
</body>
</html>
